<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secure Connect - Real-Time Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    #messages { border: 1px solid #ccc; height: 220px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    input, button { padding: 8px; }
  </style>
</head>
<body>
  <h3>Room: general</h3>
  <input id="username" placeholder="Your name (e.g. Aditi)" />
  <div id="messages"></div>
  <input id="msgInput" placeholder="Type a message..." style="width: 70%;" />
  <button onclick="sendMsg()">Send</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const room = 'general';

    socket.on('connect', () => {
      socket.emit('joinRoom', { room });
    });

    socket.on('chatMessage', ({ username, message }) => {
      const div = document.createElement('div');
      div.textContent = `[${room}] ${username}: ${message}`;
      document.getElementById('messages').appendChild(div);
    });

    function sendMsg() {
      const username = document.getElementById('username').value || 'User';
      const input = document.getElementById('msgInput');
      if (!input.value.trim()) return;
      socket.emit('chatMessage', { room, username, message: input.value });
      input.value = '';
    }
  </script>
</body>
</html>
